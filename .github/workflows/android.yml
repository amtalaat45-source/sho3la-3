name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Unzip project
      run: unzip -q "Shoala-Android-Project (3).zip" -d extracted_project

    - name: Build with Gradle
      run: |
        GRADLEW_PATH=$(find extracted_project -name "gradlew" -type f | head -n 1)
        PROJECT_DIR=$(dirname "$GRADLEW_PATH")
        cd "$PROJECT_DIR"
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Shoala-Debug-APK
        path: extracted_project/**/build/outputs/apk/debug/*.apk
